[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.22.1",
    "cryptography==49.0.0",
    "fastapi==0.136.1",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "pwdlib[argon2]==0.3.0",
    "python-multipart==0.0.27",
    "sqlalchemy==2.0.51",
    "uvicorn==0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "respx==0.23.1",
    "ruff==0.16.0",
    "tzdata==2025.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that verify integration contracts or live services",
]

[tool.setuptools.packages.find]
where = ["src"]
