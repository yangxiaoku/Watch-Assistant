# Standalone override: run Watch Assistant without a pre-existing
# `pansou_default` Docker network. It flips the external network to a
# compose-managed one, so `docker compose up` creates it automatically. Point
# PANSOU_BASE_URL (in .env) at any reachable PanSou instance, e.g.
# http://192.168.1.50:8787.
#
#   docker compose -f docker-compose.yml -f compose.standalone.yml up -d --build
#
# If you already run PanSou on the shared `pansou_default` network, keep using
# the plain docker-compose.yml (no override).
networks:
  existing_services:
    external: false
    name: ${EXTERNAL_NETWORK:-pansou_default}
