name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - codex/publish-main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run offline verification gate
        run: bash scripts/verify.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: ignore

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare non-secret Compose placeholders
        run: |
          mkdir -p secrets
          printf 'ci-placeholder\n' > secrets/encryption_key
          printf 'ci-placeholder\n' > secrets/tmdb_api_key
          printf 'ci-placeholder\n' > secrets/web_password_hash
          printf 'ci-placeholder\n' > secrets/script_token_hash

      - name: Validate Compose configuration
        run: WATCH_ASSISTANT_RELEASE="${{ github.sha }}" docker compose --env-file .env.example config --quiet
